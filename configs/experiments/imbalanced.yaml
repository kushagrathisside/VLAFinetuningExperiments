# TEMPLATE -- not yet a runnable experiment.
#
# The design forbids presuming which demonstration dimension is under-covered.
# This file's `intervention.episode_ids` is intentionally a placeholder; the
# real list is generated by profiling so100_pickplace@clean/v1 first
# (`mtrain profile so100_pickplace clean/v1`) and then deliberately skewing the
# episode selection along whichever dimension the profile shows meaningful
# variation in (task, trajectory length, or similar -- see
# model_training.data.profile and docs/EXPERIMENTS.md), via
# `mtrain build-intervention --kind imbalanced ...`, which rewrites this file's
# `intervention` block with the resolved `variable`, `variable_value` and
# `episode_ids`.
#
# Loadable as-is (kind: custom with an empty selection is valid YAML/schema),
# but resolving it into a dataset version will fail loudly with "no episodes"
# until regenerated -- which is the point: it must fail rather than silently
# train on nothing.

experiment_name: imbalanced_data
hypothesis: >
  TEMPLATE -- fill in after profiling: "Skewing the demonstration set to
  under-represent <variable>=<value> degrades SmolVLA's performance
  specifically on that slice, disproportionately to its effect on other
  slices."
objective: >
  Construct a deliberately imbalanced training set along a dimension chosen
  from the dataset's actual profile, to give the rebalanced experiment a real
  weak regime to target.

intervention:
  kind: custom
  episode_ids: []
  reason: "PLACEHOLDER -- regenerate via `mtrain build-intervention --kind imbalanced`"

tags:
  intervention: imbalanced_data
  hypothesis: coverage_vs_quantity
